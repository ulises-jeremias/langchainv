<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }} · LangChainV</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}">LangChain<span>V</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/getting-started/' | relative_url }}">Get started</a>
        <a href="{{ '/tutorials/' | relative_url }}">Tutorials</a>
        <a href="{{ '/components/' | relative_url }}">Components</a>
        <a href="{{ '/providers/' | relative_url }}">Providers</a>
        <a href="{{ '/production/' | relative_url }}">Production</a>
        <a href="{{ '/api/' | relative_url }}">API</a>
        <a href="{{ '/reference/' | relative_url }}">Reference</a>
        <a href="https://github.com/ulises-jeremias/langchainv">GitHub ↗</a>
      </nav>
    </header>
    <main class="page {{ page.layout_class }}">
      {{ content }}
    </main>
    <footer>LangChainV · MIT · Built with V and GitHub Pages</footer>
  </body>
</html>
