name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.v'
      - 'README.md'
      - '**/README.md'
      - 'v.mod'
      - 'scripts/check_provider_catalog.py'
      - 'scripts/check_site_links.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.v'
      - 'README.md'
      - '**/README.md'
      - 'v.mod'
      - 'scripts/check_provider_catalog.py'
      - 'scripts/check_site_links.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VJOBS: '2'
  V_COMPILER_REF: 7f5b9a3ddedafcfa86a88a4697c12c10e5901168

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: langchainv
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Setup pinned V compiler
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          version: ${{ env.V_COMPILER_REF }}
      - name: Generate searchable API reference
        run: |
          cd langchainv
          mkdir -p docs/api
          v doc -f html -m -readme -no-timestamp -o docs/api .
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./langchainv/docs
          destination: ./_site
      - name: Check provider catalog
        run: python3 langchainv/scripts/check_provider_catalog.py
      - name: Check generated API reference
        run: |
          test -s _site/api/index.html
          test -s _site/api/search_index.js
      - name: Check generated site links
        run: python3 langchainv/scripts/check_site_links.py _site --baseurl /langchainv
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
