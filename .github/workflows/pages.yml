name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'llms/**'
      - 'embeddings/**'
      - 'vectorstores/**'
      - 'README.md'
      - 'examples/README.md'
      - 'scripts/check_provider_catalog.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'llms/**'
      - 'embeddings/**'
      - 'vectorstores/**'
      - 'README.md'
      - 'examples/README.md'
      - 'scripts/check_provider_catalog.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check provider catalog
        run: python3 scripts/check_provider_catalog.py
      - name: Check generated site links
        run: python3 scripts/check_site_links.py _site --baseurl /langchainv
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
