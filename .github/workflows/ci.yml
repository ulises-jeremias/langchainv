name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langchainv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VJOBS: '2'
  V_COMPILER_REF: 7f5b9a3ddedafcfa86a88a4697c12c10e5901168

jobs:
  v-static:
    name: V format and Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout LangChainV
        uses: actions/checkout@v7
        with:
          path: langchainv
          persist-credentials: false

      - name: Check CI package coverage and command policy
        run: python3 langchainv/scripts/check_ci_coverage.py

      - name: Setup pinned V compiler
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          version: ${{ env.V_COMPILER_REF }}

      - name: Install under the V module path
        run: |
          mkdir -p "$HOME/.vmodules/ulises_jeremias"
          mv langchainv "$HOME/.vmodules/ulises_jeremias/langchainv"

      - name: Verify V formatting
        run: |
          cd "$HOME/.vmodules/ulises_jeremias/langchainv"
          v fmt -verify .

      - name: Compile Markdown examples
        run: |
          cd "$HOME/.vmodules/ulises_jeremias/langchainv"
          v check-md -hide-warnings -skip-line-length-check .

  v-checks:
    name: V ${{ matrix.group }}
    needs: v-static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: core and framework packages
            packages: 'schema jsonschema llms llms/fake llms/cache llms/cache/inmemory llms/cache/sqlite llms/middleware callbacks chains agents prompts outputparser memory memory/sqlite memory/sqlhistory memory/mongodb memory/zep testing/llmtest util/alloydbutil util/cloudsqlutil'
          - group: LLM providers
            packages: 'llms/openai llms/llamafile llms/local llms/bedrock llms/anthropic llms/cohere llms/ernie llms/maritaca llms/mistral llms/huggingface llms/cloudflare llms/ollama llms/googleai llms/vertex llms/watsonx'
          - group: embedding providers
            packages: 'embeddings embeddings/openai embeddings/ollama embeddings/googleai embeddings/jina embeddings/mistral embeddings/voyageai embeddings/huggingface embeddings/bedrock'
          - group: vector stores
            packages: 'vectorstores vectorstores/azureaisearch vectorstores/chroma vectorstores/dolt vectorstores/mariadb vectorstores/milvus vectorstores/opensearch vectorstores/pgvector vectorstores/redis vectorstores/mongodb vectorstores/qdrant vectorstores/pinecone vectorstores/weaviate'
          - group: tools and document processing
            packages: 'tools tools/duckduckgo tools/perplexity tools/serpapi tools/wikipedia tools/exa tools/scraper tools/sqldatabase tools/zapier documentloaders textsplitter httputil'
          - group: standalone examples
            packages: ''
    steps:
      - name: Checkout LangChainV
        uses: actions/checkout@v7
        with:
          path: langchainv
          persist-credentials: false

      - name: Setup pinned V compiler
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          version: ${{ env.V_COMPILER_REF }}

      - name: Install PDF text extractor
        if: contains(matrix.packages, 'documentloaders')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Install under the V module path
        run: |
          mkdir -p "$HOME/.vmodules/ulises_jeremias"
          mv langchainv "$HOME/.vmodules/ulises_jeremias/langchainv"

      - name: Test package group
        if: matrix.packages != ''
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          cd "$HOME/.vmodules/ulises_jeremias/langchainv"
          for package in $PACKAGES; do
            echo "::group::v test ./$package"
            v test "./$package"
            echo "::endgroup::"
          done

      - name: Compile and run standalone examples
        if: matrix.group == 'standalone examples'
        run: |
          cd "$HOME/.vmodules/ulises_jeremias/langchainv"
          for example in examples/*/main.v docs/_includes/tutorials/*.v; do
            echo "::group::Compile and run $example"
            output="/tmp/langchainv-example-$(basename "$(dirname "$example")")"
            v -o "$output" "$example"
            env -u LANGCHAINV_ALLOW_LIVE_EXAMPLES "$output"
            echo "::endgroup::"
          done
