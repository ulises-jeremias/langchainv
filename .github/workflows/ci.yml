name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langchainv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v-checks:
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'
      V_COMPILER_REF: 03e12f368ad5061756d523891e12cd759053f486
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: langchainv
          persist-credentials: false

      - name: Check out pinned V compiler
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_COMPILER_REF }}
          path: vlang
          persist-credentials: false

      - name: Cache pinned V compiler
        id: v-compiler-cache
        uses: actions/cache@v6
        with:
          path: vlang/v
          key: ${{ runner.os }}-ubuntu-24.04-v-${{ env.V_COMPILER_REF }}

      - name: Build V compiler
        if: steps.v-compiler-cache.outputs.cache-hit != 'true'
        run: |
          make -C vlang

      - name: Add V compiler to PATH
        run: |
          echo "$GITHUB_WORKSPACE/vlang" >> "$GITHUB_PATH"
          ./vlang/v version

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Install under the V module path
        run: |
          mkdir -p "$HOME/.vmodules/ulises_jeremias"
          mv langchainv "$HOME/.vmodules/ulises_jeremias/langchainv"

      - name: Format and test implemented packages
        run: |
          cd "$HOME/.vmodules/ulises_jeremias/langchainv"
          v fmt -verify .
          v check-md -hide-warnings -skip-line-length-check .
          for package in schema jsonschema llms llms/openai llms/llamafile llms/local llms/bedrock llms/anthropic llms/cohere llms/ernie llms/maritaca llms/mistral llms/huggingface llms/cloudflare llms/ollama llms/googleai llms/vertex llms/watsonx embeddings embeddings/openai embeddings/ollama embeddings/googleai embeddings/jina embeddings/voyageai embeddings/huggingface embeddings/bedrock tools tools/duckduckgo tools/perplexity tools/serpapi tools/wikipedia tools/exa tools/scraper tools/sqldatabase tools/zapier callbacks chains agents vectorstores vectorstores/chroma vectorstores/milvus vectorstores/opensearch vectorstores/pgvector vectorstores/redis vectorstores/qdrant vectorstores/pinecone vectorstores/weaviate prompts outputparser memory memory/sqlite documentloaders textsplitter testing/llmtest httputil; do
            v test "./$package"
          done
          for example in examples/*/main.v; do
            output="/tmp/langchainv-example-$(basename "$(dirname "$example")")"
            v -o "$output" "$example"
            env -u LANGCHAINV_ALLOW_LIVE_EXAMPLES "$output"
          done
